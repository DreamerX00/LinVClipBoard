name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only token by default; the release job requests contents: write itself.
permissions:
  contents: read

# A newer push to the same PR supersedes the running one. Pushes to main and
# tags are never cancelled — a tag run publishes the release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Fail loudly if Cargo.lock is out of date instead of silently rewriting it
  # on the runner. Keeps CI on exactly the dependency versions in git.
  CARGO_FLAGS: --locked

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/linvclip-ui/package-lock.json
      - uses: ./.github/actions/linux-deps
      - name: Build frontend
        # tauri::generate_context!() embeds `frontendDist` at compile time and
        # fails if the directory is missing, so clippy needs the built assets.
        working-directory: crates/linvclip-ui
        run: npm ci && npm run build
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets ${{ env.CARGO_FLAGS }} -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/linvclip-ui/package-lock.json
      - name: Enable long paths (Windows)
        if: matrix.os == 'windows-latest'
        run: git config --system core.longpaths true
      - uses: ./.github/actions/linux-deps
        if: matrix.os == 'ubuntu-latest'
      - name: Build frontend
        # tauri::generate_context!() embeds `frontendDist` at compile time and
        # fails if the directory is missing, so the UI crate's tests need it.
        working-directory: crates/linvclip-ui
        run: npm ci && npm run build
      - name: Build daemon binaries for Tauri resources (Windows)
        # tauri-build validates bundle.resources at compile time, and
        # tauri.windows.conf.json bundles clipd.exe/clipctl.exe — so they must
        # exist before the linvclip-ui crate (and therefore
        # cargo test --workspace) can compile.
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cargo build ${{ env.CARGO_FLAGS }} -p clipd -p clipctl
          Copy-Item "target/debug/clipd.exe" "crates/linvclip-ui/src-tauri/resources/" -Force
          Copy-Item "target/debug/clipctl.exe" "crates/linvclip-ui/src-tauri/resources/" -Force
      - name: Run tests
        run: cargo test --workspace ${{ env.CARGO_FLAGS }}

  build-daemon:
    name: Build Daemon (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust-toolchain
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build
        run: cross build --release ${{ env.CARGO_FLAGS }} --target ${{ matrix.target }} -p clipd -p clipctl

  build-ui:
    name: Build UI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/linvclip-ui/package-lock.json
      - uses: ./.github/actions/linux-deps
      - name: Build UI
        working-directory: crates/linvclip-ui
        # Also checks that the npm @tauri-apps/* versions match the Rust tauri
        # crates — the CLI refuses to build on a major/minor mismatch.
        run: npm ci && npx tauri build -- ${{ env.CARGO_FLAGS }}

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust-toolchain
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/linvclip-ui/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - name: Enable long paths
        run: git config --system core.longpaths true
      - name: Install npm dependencies
        working-directory: crates/linvclip-ui
        run: npm ci
      - name: Build Rust binaries
        run: cargo build --release ${{ env.CARGO_FLAGS }} -p clipd -p clipctl
      - name: Copy binaries to Tauri resources
        shell: pwsh
        run: |
          Copy-Item "target/release/clipd.exe" "crates/linvclip-ui/src-tauri/resources/" -Force
          Copy-Item "target/release/clipctl.exe" "crates/linvclip-ui/src-tauri/resources/" -Force
      - name: Build Tauri Windows app
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        working-directory: crates/linvclip-ui
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            npx tauri build --bundles nsis -- ${{ env.CARGO_FLAGS }}
          } else {
            # No signing key -> disable updater artifacts so unsigned builds still ship.
            # The override goes through a file: inline JSON loses its quotes when
            # PowerShell hands it to the npx .cmd shim, and the CLI then fails to parse it.
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY, Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -ErrorAction SilentlyContinue
            Set-Content -Path ci-no-updater.json -Value '{"bundle":{"createUpdaterArtifacts":false}}' -NoNewline
            npx tauri build --bundles nsis --config ci-no-updater.json -- ${{ env.CARGO_FLAGS }}
          }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          # The UI crate is a workspace member, so cargo/tauri write to the
          # workspace-level target dir, not crates/linvclip-ui/src-tauri/target.
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sig
            target/release/bundle/nsis/*.nsis.zip
          if-no-files-found: error
      - name: Upload Windows binaries
        uses: actions/upload-artifact@v6
        with:
          name: windows-binaries
          path: |
            target/release/clipd.exe
            target/release/clipctl.exe
          if-no-files-found: error

  build-windows-cross:
    name: Build Windows (cross)
    # ponytail: fallback build only — duplicates build-windows, so run on manual dispatch only
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust-toolchain
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - uses: Swatinem/rust-cache@v2
      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis lld llvm mingw-w64
          cargo install cargo-xwin
      - name: Build Rust binaries (cross)
        run: cargo xwin build --release ${{ env.CARGO_FLAGS }} --target x86_64-pc-windows-msvc -p clipd -p clipctl
      - name: Build Tauri (cross)
        run: |
          mkdir -p crates/linvclip-ui/src-tauri/resources
          cp target/x86_64-pc-windows-msvc/release/clipd.exe crates/linvclip-ui/src-tauri/resources/
          cp target/x86_64-pc-windows-msvc/release/clipctl.exe crates/linvclip-ui/src-tauri/resources/
          cd crates/linvclip-ui
          npm ci
          npx tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc --bundles nsis -- ${{ env.CARGO_FLAGS }}
      - name: Upload cross-compiled installer
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer-cross
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Release
    needs: [lint, test, build-daemon, build-ui, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/linvclip-ui/package-lock.json
      - uses: ./.github/actions/linux-deps
      - name: Build all
        run: make build-all
      - name: Package .deb
        run: make deb
      - name: Download Windows artifacts
        uses: actions/download-artifact@v7
        with:
          name: windows-installer
          path: windows-installer
      - name: Generate update manifest
        run: |
          # ponytail: derive name/version from the actual artifact, not the tag — a tag
          # pushed without a version bump would otherwise publish a 404 download URL
          EXE_FILE=$(ls windows-installer/*-setup.exe 2>/dev/null | head -1 || true)
          SIG_FILE=$(ls windows-installer/*.sig 2>/dev/null | head -1 || true)
          if [ -z "$EXE_FILE" ] || [ -z "$SIG_FILE" ]; then
            echo "No signed Windows installer found — skipping update manifest"
            exit 0
          fi
          EXE_NAME=$(basename "$EXE_FILE")
          VERSION=$(echo "$EXE_NAME" | sed -E 's/^LinVClipBoard_(.+)_x64-setup\.exe$/\1/')
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SIGNATURE=$(cat "$SIG_FILE")
          cat > update-windows-x86_64.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "Release v${VERSION} of LinVClipBoard",
            "pub_date": "${TIMESTAMP}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${SIGNATURE}",
                "url": "https://github.com/DreamerX00/LinVClipBoard/releases/download/${GITHUB_REF_NAME}/${EXE_NAME}"
              }
            }
          }
          EOF
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/debian/*.deb
            windows-installer/*.exe
            windows-installer/*.sig
            update-windows-x86_64.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
