name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only token by default; the release job requests contents: write itself.
permissions:
  contents: read

# A newer push to the same PR supersedes the running one. Pushes to main and
# tags are never cancelled — a tag run publishes the release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Fail loudly if Cargo.lock is out of date instead of silently rewriting it
  # on the runner. Keeps CI on exactly the dependency versions in git.
  CARGO_FLAGS: --locked

# Runner images are pinned, not `-latest`: ubuntu-latest moves to Ubuntu 26 on
# 2026-10-19 and the apt package names below (e.g. libappindicator3-dev) change
# between releases. Bump the image and the linux-deps action together.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/linvclip-ui/package-lock.json
      - uses: ./.github/actions/linux-deps
      - name: Build frontend
        # tauri::generate_context!() embeds `frontendDist` at compile time and
        # fails if the directory is missing, so clippy needs the built assets.
        working-directory: crates/linvclip-ui
        run: npm ci && npm run build
      - name: Frontend lint and tests
        working-directory: crates/linvclip-ui
        run: npm run lint && npm test
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets ${{ env.CARGO_FLAGS }} -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/linvclip-ui/package-lock.json
      - name: Enable long paths (Windows)
        if: matrix.os == 'windows-2025'
        run: git config --system core.longpaths true
      - uses: ./.github/actions/linux-deps
        if: matrix.os == 'ubuntu-24.04'
      - name: Build frontend
        # tauri::generate_context!() embeds `frontendDist` at compile time and
        # fails if the directory is missing, so the UI crate's tests need it.
        working-directory: crates/linvclip-ui
        run: npm ci && npm run build
      - name: Build daemon binaries for Tauri resources (Windows)
        # tauri-build validates bundle.resources at compile time, and
        # tauri.windows.conf.json bundles clipd.exe/clipctl.exe — so they must
        # exist before the linvclip-ui crate (and therefore
        # cargo test --workspace) can compile.
        if: matrix.os == 'windows-2025'
        shell: pwsh
        run: |
          cargo build ${{ env.CARGO_FLAGS }} -p clipd -p clipctl
          Copy-Item "target/debug/clipd.exe" "crates/linvclip-ui/src-tauri/resources/" -Force
          Copy-Item "target/debug/clipctl.exe" "crates/linvclip-ui/src-tauri/resources/" -Force
      - name: Run tests
        run: cargo test --workspace ${{ env.CARGO_FLAGS }}

  build-daemon:
    name: Build Daemon (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust-toolchain
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build
        run: cross build --release ${{ env.CARGO_FLAGS }} --target ${{ matrix.target }} -p clipd -p clipctl

  build-ui:
    name: Build UI
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/linvclip-ui/package-lock.json
      - uses: ./.github/actions/linux-deps
      - name: Require release secrets (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
        run: |
          # A tag build publishes what it produces; never ship GIF search disabled.
          [ -n "$KLIPY_API_KEY" ] || { echo "::error::KLIPY_API_KEY secret is not set — refusing to release a build without GIF search"; exit 1; }
      - name: Build UI
        working-directory: crates/linvclip-ui
        # Also checks that the npm @tauri-apps/* versions match the Rust tauri
        # crates — the CLI refuses to build on a major/minor mismatch.
        # KLIPY_API_KEY is embedded by build.rs; without it the artifact ships
        # with GIF search disabled (see CONTRIBUTING.md).
        env:
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
        run: npm ci && npx tauri build -- ${{ env.CARGO_FLAGS }}

  build-windows:
    name: Build Windows
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust-toolchain
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/linvclip-ui/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - name: Enable long paths
        run: git config --system core.longpaths true
      - name: Install npm dependencies
        working-directory: crates/linvclip-ui
        run: npm ci
      - name: Build Rust binaries
        run: cargo build --release ${{ env.CARGO_FLAGS }} -p clipd -p clipctl
      - name: Copy binaries to Tauri resources
        shell: pwsh
        run: |
          Copy-Item "target/release/clipd.exe" "crates/linvclip-ui/src-tauri/resources/" -Force
          Copy-Item "target/release/clipctl.exe" "crates/linvclip-ui/src-tauri/resources/" -Force
      - name: Require release secrets (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # The .exe built here is what the release job ships and what the
          # in-app updater installs: it needs GIF search and a signature.
          if (-not $env:KLIPY_API_KEY) { Write-Output "::error::KLIPY_API_KEY secret is not set"; exit 1 }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { Write-Output "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set — the updater cannot verify an unsigned installer"; exit 1 }
      - name: Build Tauri Windows app
        shell: pwsh
        env:
          # KLIPY_API_KEY is embedded by build.rs; this job builds the .exe that
          # ships, so it needs the key just like build-ui and release.
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        working-directory: crates/linvclip-ui
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            npx tauri build --bundles nsis -- ${{ env.CARGO_FLAGS }}
          } else {
            # No signing key -> disable updater artifacts so unsigned builds still ship.
            # The override goes through a file: inline JSON loses its quotes when
            # PowerShell hands it to the npx .cmd shim, and the CLI then fails to parse it.
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY, Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -ErrorAction SilentlyContinue
            Set-Content -Path ci-no-updater.json -Value '{"bundle":{"createUpdaterArtifacts":false}}' -NoNewline
            npx tauri build --bundles nsis --config ci-no-updater.json -- ${{ env.CARGO_FLAGS }}
          }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          # The UI crate is a workspace member, so cargo/tauri write to the
          # workspace-level target dir, not crates/linvclip-ui/src-tauri/target.
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sig
            target/release/bundle/nsis/*.nsis.zip
          if-no-files-found: error
      - name: Upload Windows binaries
        uses: actions/upload-artifact@v6
        with:
          name: windows-binaries
          path: |
            target/release/clipd.exe
            target/release/clipctl.exe
          if-no-files-found: error

  build-windows-cross:
    name: Build Windows (cross)
    # ponytail: fallback build only — duplicates build-windows, so run on manual dispatch only
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust-toolchain
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - uses: Swatinem/rust-cache@v2
      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis lld llvm mingw-w64
          cargo install cargo-xwin
      - name: Build Rust binaries (cross)
        run: cargo xwin build --release ${{ env.CARGO_FLAGS }} --target x86_64-pc-windows-msvc -p clipd -p clipctl
      - name: Build Tauri (cross)
        env:
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
        run: |
          mkdir -p crates/linvclip-ui/src-tauri/resources
          cp target/x86_64-pc-windows-msvc/release/clipd.exe crates/linvclip-ui/src-tauri/resources/
          cp target/x86_64-pc-windows-msvc/release/clipctl.exe crates/linvclip-ui/src-tauri/resources/
          cd crates/linvclip-ui
          npm ci
          npx tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc --bundles nsis -- ${{ env.CARGO_FLAGS }}
      - name: Upload cross-compiled installer
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer-cross
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Release
    needs: [lint, test, build-daemon, build-ui, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/linvclip-ui/package-lock.json
      - uses: ./.github/actions/linux-deps
      - name: Require release secrets
        env:
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
        run: |
          [ -n "$KLIPY_API_KEY" ] || { echo "::error::KLIPY_API_KEY secret is not set — refusing to release a build without GIF search"; exit 1; }
      - name: Build all
        env:
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
        run: make build-all
      - name: Package .deb
        run: ./packaging/build-deb.sh --skip-build
      - name: Package portable tarball
        run: ./packaging/build-tarball.sh
      - name: Download Windows artifacts
        uses: actions/download-artifact@v7
        with:
          name: windows-installer
          path: windows-installer
      - name: Release notes
        # Body = the CHANGELOG.md section for this version (scripts/release.sh
        # writes it), else the annotated tag message, else a one-liner. GitHub's
        # generated "What's Changed" list is appended underneath either way.
        run: |
          if ! ./packaging/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md 2>/dev/null; then
            git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents:body)' > release-notes.md
          fi
          if [ -z "$(tr -d '[:space:]' < release-notes.md)" ]; then
            echo "Release $GITHUB_REF_NAME of LinVClipBoard." > release-notes.md
          fi
          cat release-notes.md
      - name: Generate update manifest
        # The in-app updater (tauri-plugin-updater) fetches this file from
        # releases/latest/download/ — see plugins.updater.endpoints in
        # tauri.conf.json. A release without it (or without the .sig) would
        # leave every Windows user unable to update, so this step fails hard.
        run: |
          # ponytail: derive name/version from the actual artifact, not the tag — a tag
          # pushed without a version bump would otherwise publish a 404 download URL
          EXE_FILE=$(ls windows-installer/*-setup.exe 2>/dev/null | head -1 || true)
          SIG_FILE=$(ls windows-installer/*-setup.exe.sig 2>/dev/null | head -1 || true)
          if [ -z "$EXE_FILE" ] || [ -z "$SIG_FILE" ]; then
            echo "::error::No signed Windows installer in the windows-installer artifact (exe='$EXE_FILE' sig='$SIG_FILE')"
            exit 1
          fi
          EXE_NAME=$(basename "$EXE_FILE")
          VERSION=$(echo "$EXE_NAME" | sed -E 's/^LinVClipBoard_(.+)_x64-setup\.exe$/\1/')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Installer version $VERSION does not match tag $GITHUB_REF_NAME — bump the version before tagging"
            exit 1
          fi
          # jq does the quoting: the notes are multi-line Markdown and the
          # signature is base64 that must land in the JSON byte-for-byte.
          jq -n \
            --arg version "$VERSION" \
            --rawfile notes release-notes.md \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rawfile signature "$SIG_FILE" \
            --arg url "https://github.com/DreamerX00/LinVClipBoard/releases/download/${GITHUB_REF_NAME}/${EXE_NAME}" \
            '{version: $version, notes: $notes, pub_date: $pub_date,
              platforms: {"windows-x86_64": {signature: ($signature | rtrimstr("\n")), url: $url}}}' \
            > update-windows-x86_64.json
          cat update-windows-x86_64.json
      - name: Collect assets and write SHA256SUMS
        # install.sh downloads SHA256SUMS next to the .deb and refuses to
        # install without it; the in-app updater verifies the .deb/.exe it
        # downloads against it too. So the checksum file is not optional.
        run: |
          mkdir -p release-assets
          cp target/debian/*.deb target/tarball/*.tar.gz release-assets/
          cp windows-installer/*.exe windows-installer/*.sig release-assets/
          cp update-windows-x86_64.json release-assets/
          cd release-assets && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Create GitHub Release
        # A "-" in the tag (v3.2.0-beta.1) marks a pre-release. If
        # scripts/release.sh already created the release (local build mode),
        # this updates it in place and adds the CI-built assets.
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
