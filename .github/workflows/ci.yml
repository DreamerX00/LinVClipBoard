name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; the release job raises this for itself.
permissions:
  contents: read

# A new push to the same PR/branch supersedes the in-flight run. Tag builds are
# never cancelled so a release is not interrupted by an unrelated push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with rust-toolchain.toml — the lint job fails if they drift.
  # Pinning means CI only breaks on code changes, not on a new stable release
  # shipping new clippy lints (we run clippy with `-D warnings`).
  RUST_TOOLCHAIN: 1.98.1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/linvclip-ui/package-lock.json
      - name: Check toolchain pin is consistent
        run: |
          PIN=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          if [ "$PIN" != "$RUST_TOOLCHAIN" ]; then
            echo "::error::rust-toolchain.toml pins $PIN but RUST_TOOLCHAIN in ci.yml is $RUST_TOOLCHAIN — update both together"
            exit 1
          fi
          echo "Toolchain pin OK: $PIN"
      - name: Check version fields agree
        # The release manifest, the .deb name and the NSIS installer name are all
        # derived from these; a mismatch ships a release with the wrong version.
        run: |
          CARGO_V=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          NPM_V=$(node -p "require('./crates/linvclip-ui/package.json').version")
          TAURI_V=$(node -p "require('./crates/linvclip-ui/src-tauri/tauri.conf.json').version")
          echo "Cargo.toml=$CARGO_V package.json=$NPM_V tauri.conf.json=$TAURI_V"
          if [ "$CARGO_V" != "$NPM_V" ] || [ "$CARGO_V" != "$TAURI_V" ]; then
            echo "::error::Version fields disagree — bump Cargo.toml, package.json and tauri.conf.json together"
            exit 1
          fi
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsqlite3-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libgtk-3-dev libglib2.0-dev libgdk-pixbuf-2.0-dev libatk1.0-dev \
            libpango1.0-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Build frontend
        # tauri::generate_context!() embeds `frontendDist` at compile time and
        # fails if the directory is missing, so clippy needs the built assets.
        # `npm ci` (not `npm install`) fails loudly if package-lock.json is stale.
        working-directory: crates/linvclip-ui
        run: npm ci && npm run build
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        # --locked: fail if Cargo.lock is out of sync with Cargo.toml instead of
        # silently resolving different dependency versions than developers use.
        run: cargo clippy --workspace --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/linvclip-ui/package-lock.json
      - name: Enable long paths (Windows)
        if: matrix.os == 'windows-latest'
        run: git config --system core.longpaths true
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsqlite3-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libgtk-3-dev libglib2.0-dev libgdk-pixbuf-2.0-dev libatk1.0-dev \
            libpango1.0-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Build frontend
        # tauri::generate_context!() embeds `frontendDist` at compile time and
        # fails if the directory is missing, so the UI crate's tests need it.
        working-directory: crates/linvclip-ui
        run: npm ci && npm run build
      - name: Build daemon binaries for Tauri resources (Windows)
        # tauri-build validates bundle.resources at compile time, and the Windows
        # config (tauri.windows.conf.json) bundles clipd.exe/clipctl.exe — so they
        # must exist before the linvclip-ui crate (and therefore
        # cargo test --workspace) can compile.
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cargo build --locked -p clipd -p clipctl
          Copy-Item "target/debug/clipd.exe" "crates/linvclip-ui/src-tauri/resources/" -Force
          Copy-Item "target/debug/clipctl.exe" "crates/linvclip-ui/src-tauri/resources/" -Force
      - name: Run tests
        run: cargo test --workspace --locked

  build-daemon:
    name: Build Daemon (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }} -p clipd -p clipctl

  build-ui:
    name: Build UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/linvclip-ui/package-lock.json
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsqlite3-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libgtk-3-dev libglib2.0-dev libgdk-pixbuf-2.0-dev libatk1.0-dev \
            libpango1.0-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Build UI
        # On Linux tauri.linux.conf.json sets bundle.active=false: this compiles
        # the GUI binary only. Linux packaging is done by packaging/build-deb.sh.
        working-directory: crates/linvclip-ui
        run: npm ci && npx tauri build
      - name: Check GUI binary was produced
        run: test -x target/release/linvclip-ui

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/linvclip-ui/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - name: Enable long paths
        run: git config --system core.longpaths true
      - name: Install npm dependencies
        working-directory: crates/linvclip-ui
        run: npm ci
      - name: Build Rust binaries
        run: cargo build --release --locked -p clipd -p clipctl
      - name: Copy binaries to Tauri resources
        shell: pwsh
        run: |
          Copy-Item "target/release/clipd.exe" "crates/linvclip-ui/src-tauri/resources/" -Force
          Copy-Item "target/release/clipctl.exe" "crates/linvclip-ui/src-tauri/resources/" -Force
      - name: Build Tauri Windows app
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        working-directory: crates/linvclip-ui
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            npx tauri build --bundles nsis
          } else {
            # No signing key -> disable updater artifacts so unsigned builds still ship.
            # The override goes through a file: inline JSON loses its quotes when
            # PowerShell hands it to the npx .cmd shim, and the CLI then fails to parse it.
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY, Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -ErrorAction SilentlyContinue
            Set-Content -Path ci-no-updater.json -Value '{"bundle":{"createUpdaterArtifacts":false}}' -NoNewline
            npx tauri build --bundles nsis --config ci-no-updater.json
          }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          # The UI crate is a workspace member, so cargo/tauri write to the
          # workspace-level target dir, not crates/linvclip-ui/src-tauri/target.
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sig
            target/release/bundle/nsis/*.nsis.zip
          if-no-files-found: error
      - name: Upload Windows binaries
        uses: actions/upload-artifact@v6
        with:
          name: windows-binaries
          path: |
            target/release/clipd.exe
            target/release/clipctl.exe
          if-no-files-found: error

  build-windows-cross:
    name: Build Windows (cross)
    # ponytail: fallback build only — duplicates build-windows, so run on manual dispatch only
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - uses: Swatinem/rust-cache@v2
      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis lld llvm mingw-w64
          cargo install cargo-xwin
      - name: Build Rust binaries (cross)
        run: cargo xwin build --release --locked --target x86_64-pc-windows-msvc -p clipd -p clipctl
      - name: Build Tauri (cross)
        run: |
          mkdir -p crates/linvclip-ui/src-tauri/resources
          cp target/x86_64-pc-windows-msvc/release/clipd.exe crates/linvclip-ui/src-tauri/resources/
          cp target/x86_64-pc-windows-msvc/release/clipctl.exe crates/linvclip-ui/src-tauri/resources/
          cd crates/linvclip-ui
          npm ci
          npx tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc --bundles nsis
      - name: Upload cross-compiled installer
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer-cross
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Release
    needs: [lint, test, build-daemon, build-ui, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/linvclip-ui/package-lock.json
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsqlite3-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libgtk-3-dev libglib2.0-dev libgdk-pixbuf-2.0-dev libatk1.0-dev \
            libpango1.0-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Check tag matches the project version
        # A tag pushed without a version bump would publish a release whose
        # artifacts and update manifest carry a different version than the tag.
        run: |
          CARGO_V=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$CARGO_V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO_V"
            exit 1
          fi
      - name: Build all
        run: make build-all
      - name: Package .deb
        run: make deb
      - name: Download Windows artifacts
        uses: actions/download-artifact@v7
        with:
          name: windows-installer
          path: windows-installer
      - name: Generate update manifest
        run: |
          # ponytail: derive name/version from the actual artifact, not the tag — a tag
          # pushed without a version bump would otherwise publish a 404 download URL
          EXE_FILE=$(ls windows-installer/*-setup.exe 2>/dev/null | head -1 || true)
          SIG_FILE=$(ls windows-installer/*.sig 2>/dev/null | head -1 || true)
          if [ -z "$EXE_FILE" ] || [ -z "$SIG_FILE" ]; then
            echo "No signed Windows installer found — skipping update manifest"
            exit 0
          fi
          EXE_NAME=$(basename "$EXE_FILE")
          VERSION=$(echo "$EXE_NAME" | sed -E 's/^LinVClipBoard_(.+)_x64-setup\.exe$/\1/')
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SIGNATURE=$(cat "$SIG_FILE")
          cat > update-windows-x86_64.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "Release v${VERSION} of LinVClipBoard",
            "pub_date": "${TIMESTAMP}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${SIGNATURE}",
                "url": "https://github.com/DreamerX00/LinVClipBoard/releases/download/${GITHUB_REF_NAME}/${EXE_NAME}"
              }
            }
          }
          EOF
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/debian/*.deb
            windows-installer/*.exe
            windows-installer/*.sig
            update-windows-x86_64.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
