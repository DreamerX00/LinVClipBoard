name: Install Linux build dependencies
description: >
  apt packages needed to compile the workspace on ubuntu (GTK/WebKit for the
  Tauri UI, X11/Wayland for the clipboard daemon). Single source of truth so
  the list can't drift between jobs.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential pkg-config libsqlite3-dev \
          libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
          libwayland-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
          libgtk-3-dev libglib2.0-dev libgdk-pixbuf-2.0-dev libatk1.0-dev \
          libpango1.0-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
