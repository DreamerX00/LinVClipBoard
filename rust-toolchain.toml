# Pinned so CI and local builds use the same compiler. A floating "stable"
# channel means a new Rust release can add clippy lints and turn the Lint job
# red without any code change. Bump deliberately (and run `make ci`) instead.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
