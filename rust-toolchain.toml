# Pinned so CI and local builds use the same compiler. New stable releases add
# new clippy lints, and CI runs clippy with `-D warnings`, so a floating
# `stable` makes CI fail on toolchain updates rather than on real code changes.
# Bump this deliberately, together with RUST_TOOLCHAIN in .github/workflows/ci.yml
# (the Lint job fails if the two drift apart).
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
